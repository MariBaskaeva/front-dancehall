name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint and formatting
        run: |
          npm run lint
          npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Build frontend
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Smoke test static frontend
        run: npm run smoke -- "${{ github.sha }}"

      - name: Package frontend
        run: |
          mkdir -p target/frontend
          tar --create --gzip --file target/frontend/frontend.tar.gz --directory dist .
          sha256sum target/frontend/frontend.tar.gz > target/frontend/frontend.tar.gz.sha256

      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-${{ github.sha }}
          path: target/frontend/
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://87.242.119.237/
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Download frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-${{ github.sha }}
          path: frontend

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Transfer and deploy frontend
        env:
          REVISION: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key dancehall-deploy@87.242.119.237 \
            "mkdir -p incoming/frontend/$REVISION"
          scp -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key frontend/* \
            "dancehall-deploy@87.242.119.237:incoming/frontend/$REVISION/"
