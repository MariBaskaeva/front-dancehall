openapi: 3.1.0

info:
  title: Dancehall Steps API
  version: 1.0.0
  description: |
    Публичный read-only API каталога dancehall-степов.

    Названия степов и имена авторов возвращаются в том виде, в котором
    хранятся в каталоге; язык не фиксирован. API не требует авторизации
    и не предоставляет операций создания, изменения или удаления данных.

servers:
  - url: /api/v1
    description: API относительно origin frontend-приложения

security: []

tags:
  - name: Steps
    description: Поиск и просмотр dancehall-степов
  - name: Authors
    description: Справочник авторов для фильтра каталога

paths:
  /steps:
    get:
      tags:
        - Steps
      operationId: listSteps
      summary: Получить каталог степов
      description: |
        Возвращает страницу степов. Несколько значений одного фильтра
        объединяются через OR, а разные фильтры — через AND.

        Порядок элементов не гарантирован: явная сортировка не задана.
        Отрицательный `page` и `size` меньше 1 в текущей реализации
        приводят к ответу 500, а не 400.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/StyleFilter"
        - $ref: "#/components/parameters/EraFilter"
        - $ref: "#/components/parameters/AuthorFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Страница степов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepPage"
              examples:
                firstPage:
                  $ref: "#/components/examples/StepPage"
                emptyPage:
                  $ref: "#/components/examples/EmptyStepPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /steps/{slug}:
    get:
      tags:
        - Steps
      operationId: getStepBySlug
      summary: Получить степ по slug
      parameters:
        - $ref: "#/components/parameters/StepSlug"
      responses:
        "200":
          description: Степ найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
              examples:
                step:
                  $ref: "#/components/examples/Step"
                withoutAuthor:
                  $ref: "#/components/examples/StepWithoutAuthor"
        "404":
          $ref: "#/components/responses/StepNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /authors:
    get:
      tags:
        - Authors
      operationId: listAuthors
      summary: Получить справочник авторов
      description: |
        Возвращает полный непагинированный список авторов, отсортированный по
        `name` по возрастанию. Справочник предназначен для заполнения фильтра
        каталога степов.
      responses:
        "200":
          description: Список авторов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorCollection"
              examples:
                authors:
                  $ref: "#/components/examples/AuthorCollection"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    SearchQuery:
      name: q
      in: query
      required: false
      description: |
        Поиск по `name` без учёта регистра. Пустая строка и строка только
        из пробелов не применяют фильтр. Ограничение длины не задано.
        Символы `%` и `_` интерпретируются как шаблоны SQL LIKE.
      schema:
        type: string
      example: Bitter

    StyleFilter:
      name: style
      in: query
      required: false
      description: |
        Допустимые стили. Параметр можно повторять, например
        `?style=FEMALE&style=MALE`.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/StepStyle"

    EraFilter:
      name: era
      in: query
      required: false
      description: |
        Допустимые эры. Параметр можно повторять, например
        `?era=OLD&era=MIDDLE`.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/StepEra"

    AuthorFilter:
      name: author
      in: query
      required: false
      description: |
        Slug авторов. Параметр можно повторять; значения возвращает
        `GET /authors`. Неизвестный slug не вызывает ошибку,
        а не находит совпадений.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example:
        - kayti-insanity

    Page:
      name: page
      in: query
      required: false
      description: |
        Номер страницы, начиная с нуля. Отрицательное значение
        в текущей реализации приводит к ответу 500.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      example: 0

    Size:
      name: size
      in: query
      required: false
      description: |
        Количество элементов на странице. Верхняя граница не задана.
        Значение меньше 1 в текущей реализации приводит к ответу 500.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
      example: 20

    StepSlug:
      name: slug
      in: path
      required: true
      description: Slug степа. Неизвестный slug приводит к ответу 404.
      schema:
        type: string
      example: bitter-sweet

  schemas:
    Slug:
      type: string
      maxLength: 255
      description: Уникальный строковый идентификатор записи в каталоге.

    StepStyle:
      type: string
      enum:
        - FEMALE
        - MALE
      description: Стиль исполнения степа.

    StepEra:
      type: string
      enum:
        - OLD
        - MIDDLE
        - EARLY_NEW
        - NEW
        - UNKNOWN
      description: Эра, к которой относится степ.

    Author:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Неизменяемый идентификатор автора.
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
          maxLength: 200
          description: Имя автора в каталоге.

    Step:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - style
        - era
        - author
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Неизменяемый идентификатор степа.
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
          maxLength: 200
          description: Название степа в каталоге.
        style:
          $ref: "#/components/schemas/StepStyle"
        era:
          $ref: "#/components/schemas/StepEra"
        author:
          description: Автор степа; null, если автор не указан.
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"

    StepPage:
      type: object
      additionalProperties: false
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        page:
          $ref: "#/components/schemas/PageMetadata"

    PageMetadata:
      type: object
      additionalProperties: false
      required:
        - size
        - number
        - totalElements
        - totalPages
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          description: Запрошенный размер страницы.
        number:
          type: integer
          format: int64
          minimum: 0
          description: Номер текущей страницы, начиная с нуля.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Общее количество степов с учётом фильтров.
        totalPages:
          type: integer
          format: int64
          minimum: 0
          description: Общее количество страниц с учётом фильтров.

    AuthorCollection:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Author"

    ErrorResponse:
      type: object
      additionalProperties: false
      description: Ошибка поиска степа по slug.
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: STEP_NOT_FOUND
        message:
          type: string
          description: Сообщение об ошибке на английском языке.

    HttpError:
      type: object
      description: Стандартный JSON-ответ Spring Boot для ошибок 400 и 500.
      required:
        - timestamp
        - status
        - error
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          minimum: 100
          maximum: 599
        error:
          type: string
          description: Название HTTP-ошибки.
        path:
          type: string
          description: Путь запроса без query-параметров.

  responses:
    BadRequest:
      description: Некорректный тип параметра или неизвестное значение enum.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            invalidEra:
              summary: Запрос с era=OLD_SCHOOL вместо era=OLD
              value:
                timestamp: "2026-10-01T12:56:24.245Z"
                status: 400
                error: Bad Request
                path: /api/v1/steps

    StepNotFound:
      description: Степ с указанным slug не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                code: STEP_NOT_FOUND
                message: "Step with slug 'unknown-step' not found"

    InternalServerError:
      description: |
        Внутренняя ошибка сервера. Для GET /steps этот статус также
        возвращается при отрицательном page или size меньше 1.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          examples:
            invalidSize:
              summary: Запрос GET /steps?size=0
              value:
                timestamp: "2026-10-01T12:56:30.472Z"
                status: 500
                error: Internal Server Error
                path: /api/v1/steps

  examples:
    Step:
      value:
        id: 1f891828-92f8-4ff4-82f7-4b3f1ab6277e
        slug: bitter-sweet
        name: Bitter Sweet
        style: FEMALE
        era: NEW
        author:
          id: 6c9ee243-997a-4997-9236-5a5ef855791f
          slug: kayti-insanity
          name: Kayti Insanity

    StepWithoutAuthor:
      value:
        id: b1736ca6-eed8-4b87-ba98-5ce1626497e5
        slug: wata-pumpie
        name: Wata pumpie
        style: FEMALE
        era: OLD
        author: null

    StepPage:
      value:
        content:
          - id: 1f891828-92f8-4ff4-82f7-4b3f1ab6277e
            slug: bitter-sweet
            name: Bitter Sweet
            style: FEMALE
            era: NEW
            author:
              id: 6c9ee243-997a-4997-9236-5a5ef855791f
              slug: kayti-insanity
              name: Kayti Insanity
        page:
          size: 20
          number: 0
          totalElements: 1
          totalPages: 1

    EmptyStepPage:
      value:
        content: []
        page:
          size: 20
          number: 0
          totalElements: 0
          totalPages: 0

    AuthorCollection:
      value:
        items:
          - id: 6c9ee243-997a-4997-9236-5a5ef855791f
            slug: kayti-insanity
            name: Kayti Insanity
